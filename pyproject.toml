[project]
name = "eugene-crab"
dynamic = ["version"]
description = "Eugene the crab finds out why the internet is down: Wi-Fi, router, ISP, VPN, DNS, and blocks in one terminal report"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Jora" }]
keywords = ["network", "diagnostics", "tui", "terminal", "vpn", "dns", "wifi", "dpi"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["rich>=13"]

[project.urls]
Homepage = "https://github.com/nikmeee/eugene"

[project.scripts]
eugene = "eugene.app:cli"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/eugene/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eugene"]
