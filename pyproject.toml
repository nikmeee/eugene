[project]
name = "eugene-crab"
version = "0.2.0"
description = "Юджин — краб, который выясняет, почему не работает интернет: Wi-Fi, роутер, провайдер, VPN, DNS и блокировки — в одном стильном отчёте в терминале"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Jora" }]
keywords = ["network", "diagnostics", "tui", "terminal", "vpn", "dns", "wifi", "dpi"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["rich>=13"]

[project.urls]
Homepage = "https://github.com/nikmeee/eugene"

[project.scripts]
eugene = "eugene.app:cli"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eugene"]
